<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 주스 컵 외곽 살구빛 테두리 그라데이션 -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFECD6"/>
      <stop offset="100%" stop-color="#FCD8B3"/>
    </linearGradient>

    <!-- 주스 본체 비비드 오렌지 그라데이션 -->
    <linearGradient id="juiceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#F36B00"/>
    </linearGradient>

    <!-- 중앙 배치 원형 클리핑 마스크 (r: 300) -->
    <clipPath id="innerCupClip">
      <circle cx="512" cy="512" r="300"/>
    </clipPath>
  </defs>

  <!-- 1. iOS 검은 테두리 방지용 순백색 불투명 배경 (전체 채움) -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- 2. 중앙으로 작아진 메인 주스 컵 (r: 320 / r: 300) -->
  <!-- 컵 베이스 림 (외곽 살구빛 테두리) -->
  <circle cx="512" cy="512" r="320" fill="url(#rimGrad)"/>
  <!-- 컵 내부 흰색 베이스 -->
  <circle cx="512" cy="512" r="300" fill="#FFFFFF"/>

  <!-- 3. 컵 내부 주스 액체 (가운데 축소 원형에 맞춘 파도 곡선) -->
  <g clip-path="url(#innerCupClip)">
    <!-- 찰랑이는 주스 파도 (중앙 기준 50~60% 수위) -->
    <path d="M 212 430 
             Q 340 390, 470 410 
             T 700 380 
             Q 760 380, 812 395 
             L 812 812 
             L 212 812 Z" 
          fill="url(#juiceGrad)"/>

    <!-- 수면 윗부분 미세한 과즙 하이라이트 라인 -->
    <path d="M 212 430 
             Q 340 390, 470 410 
             T 700 380 
             Q 760 380, 812 395" 
          fill="none" 
          stroke="#FFAA47" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.85"/>
  </g>
</svg>
